global-credential-providers = [
    "artifacts-cargo-credprovider",
    "cargo:token",
    "cargo:wincred",
]

[registries]
Sudo_PublicPackages = { index = "sparse+https://pkgs.dev.azure.com/shine-oss/sudo/_packaging/Sudo_PublicPackages/Cargo/index/" }

[source.crates-io]
replace-with = "Sudo_PublicPackages"

[target.'cfg(target_os = "windows")']
rustflags = [
    "-Dwarnings",
    "-Cehcont_guard",
    "-Ccontrol_flow_guard",
    "-Ctarget-feature=+crt-static",
    "-Clink-args=/DEFAULTLIB:ucrt.lib",
    "-Clink-args=/NODEFAULTLIB:vcruntime.lib",
    "-Clink-args=/NODEFAULTLIB:msvcrt.lib",
    "-Clink-args=/NODEFAULTLIB:libucrt.lib",
    "-lrpcrt4",
]

# -Clink-args=/DYNAMICBASE /CETCOMPAT: Enable "shadow stack" (https://learn.microsoft.com/en-us/cpp/build/reference/cetcompat)
[target.'cfg(all(target_os = "windows", any(target_arch = "x86", target_arch = "x86_64")))']
rustflags = [
    "-Clink-args=/DYNAMICBASE",
    "-Clink-args=/CETCOMPAT",
]

# The backtrace code for panics in Rust is almost as large as the entire editor.
# = Huge reduction in binary size by removing all that.
[profile.release]
panic = "immediate-abort"

[unstable]
panic-immediate-abort = true
build-std = ["std", "panic_abort"]
